<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantaboskers · Statistiche Squadra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b1410;
    --bg-glow: radial-gradient(circle at 50% -10%, #1a2b20 0%, #0b1410 55%);
    --surface: #101d16;
    --surface-2: #16261c;
    --line: #223226;
    --gold: #e4b33c;
    --gold-soft: #4a3d1e;
    --scarlet: #c1443a;
    --text: #edefe8;
    --muted: #7e9184;
    --muted-2: #566459;
    --win: #3f8f5f;
    --loss: #c1443a;
    --draw: #7e9184;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-glow);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; }

  .marquee{ text-align:center; margin-bottom: 28px; }
  .marquee .eyebrow{
    letter-spacing: 0.35em; font-size: 11px; color: var(--gold);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .marquee h1{
    font-family:'Oswald', sans-serif; font-weight: 700; text-transform: uppercase;
    font-size: clamp(24px, 6vw, 36px); letter-spacing: 0.03em; margin: 0;
  }

  select#teamSelect{
    display:block;
    margin: 0 auto 32px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 18px;
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    width: 100%;
    max-width: 420px;
    cursor: pointer;
  }

  .panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .panel h2{
    font-family:'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin: 0 0 18px;
  }

  /* record totale */
  .record-row{ display:flex; justify-content:center; gap: 30px; margin-bottom: 6px; }
  .record-block{ text-align:center; }
  .record-num{ font-family:'Oswald', sans-serif; font-weight:700; font-size: 30px; }
  .record-label{ font-size: 9px; color: var(--muted-2); letter-spacing:0.1em; text-transform:uppercase; margin-top:4px;}
  .record-block.v .record-num{ color: var(--win); }
  .record-block.p .record-num{ color: var(--draw); }
  .record-block.s .record-num{ color: var(--loss); }
  .record-sub{ text-align:center; color: var(--muted); font-size: 12px; margin-top: 14px; }

  /* striscia attuale */
  .streak-banner{
    text-align:center; border-radius: 10px; padding: 18px; margin-bottom: 4px;
    font-family:'Oswald', sans-serif;
  }
  .streak-banner.V{ background:#132a1c; border: 1px solid #2d4b39; }
  .streak-banner.S{ background:#2a1614; border: 1px solid #4a2c29; }
  .streak-banner.P{ background: var(--surface-2); border: 1px solid var(--line); }
  .streak-banner .big{ font-size: 26px; font-weight:700; text-transform:uppercase; }
  .streak-banner.V .big{ color: var(--win); }
  .streak-banner.S .big{ color: var(--loss); }
  .streak-banner.P .big{ color: var(--muted); }
  .streak-banner .small{ font-size: 11px; color: var(--muted-2); margin-top: 4px; letter-spacing: 0.05em; }

  /* ultimi 5 */
  .last5{ display:flex; justify-content:center; gap: 10px; }
  .badge{
    width: 46px; height: 46px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald', sans-serif; font-weight:700; font-size:17px;
    border: 2px solid;
  }
  .badge.V{ color: var(--win); border-color: var(--win); background: #132a1c; }
  .badge.S{ color: var(--loss); border-color: var(--loss); background: #2a1614; }
  .badge.P{ color: var(--muted); border-color: var(--muted-2); background: var(--surface-2); }
  .last5-detail{ margin-top: 14px; }
  .l5-row{
    display:grid; grid-template-columns: 90px 1fr auto; gap: 8px; align-items:center;
    padding: 6px 0; font-size: 12px; border-bottom: 1px dashed #1c2a20;
  }
  .l5-row:last-child{ border-bottom: none; }
  .l5-season{ color: var(--muted-2); font-size: 10.5px; }
  .l5-opp{ color: var(--text); }
  .l5-gol{ font-family:'Oswald', sans-serif; font-weight:700; text-align:right; }

  /* serie piu lunghe */
  .streaks-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .streak-card{
    background: var(--surface-2); border:1px solid var(--line); border-radius: 8px;
    padding: 14px; text-align:center;
  }
  .streak-card .num{ font-family:'Oswald', sans-serif; font-weight:700; font-size: 26px; }
  .streak-card.V .num{ color: var(--win); }
  .streak-card.P .num{ color: var(--muted); }
  .streak-card.S .num{ color: var(--loss); }
  .streak-card .lbl{ font-size: 9px; color: var(--muted-2); text-transform:uppercase; letter-spacing:0.1em; margin: 4px 0 8px; }
  .streak-card .period{ font-size: 9.5px; color: var(--muted-2); }

  /* league records */
  .rec-list{ margin-bottom: 18px; }
  .rec-list-title{ font-size: 10.5px; color: var(--gold); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px; }
  .rec-item{
    display:grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items:center;
    padding: 5px 0; font-size: 13px;
  }
  .rec-rank{ color: var(--muted-2); font-family:'Oswald', sans-serif; font-weight:700;}
  .rec-name{ color: var(--text); }
  .rec-val{ font-family:'Oswald', sans-serif; font-weight:700; }
  .rec-period{ color: var(--muted-2); font-size: 10px; grid-column: 2 / 4; margin-top:-2px;}

  footer{ text-align:center; color: var(--muted-2); font-size: 11px; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">

</div>

function esitoLabel(e){ return e === 'V' ? 'Vittoria' : (e === 'S' ? 'Sconfitta' : 'Pareggio'); }

function renderTeam(s){
  const r = s.record;
  const streak = s.striscia_attuale;
  const streakType = streak.esito;
  const streakMsg = streakType === 'V'
    ? `IN SERIE POSITIVA DA ${streak.lunghezza} GIORNAT${streak.lunghezza === 1 ? 'A' : 'E'}`
    : streakType === 'S'
      ? `IN CRISI DA ${streak.lunghezza} GIORNAT${streak.lunghezza === 1 ? 'A' : 'E'} SENZA VINCERE`
      : `PAREGGIA DA ${streak.lunghezza} GIORNAT${streak.lunghezza === 1 ? 'A' : 'E'}`;

  const last5 = s.ultimi_5.slice().reverse();
  const badges = last5.map(m => `<div class="badge ${m.esito}">${m.esito}</div>`).join('');
  const l5rows = last5.map(m => `
    <div class="l5-row">
      <div class="l5-season">${m.stagione.replace('Risultati','')} G${m.giornata}</div>
      <div class="l5-opp">vs ${m.avversario_nome}</div>
      <div class="l5-gol">${m.gol} - ${m.gol_avv}</div>
    </div>`).join('');

  const sl = s.serie_piu_lunghe;
  function periodo(serie){
    if (!serie.inizio) return '';
    const a = serie.inizio, b = serie.fine;
    const sa = a.stagione.replace('Risultati','');
    const sb = b.stagione.replace('Risultati','');
    return sa === sb ? `${sa} · G${a.giornata}-G${b.giornata}` : `${sa} G${a.giornata} &rarr; ${sb} G${b.giornata}`;
  }

  return `
    <div class="panel">
      <h2>Record complessivo</h2>
      <div class="record-row">
        <div class="record-block v"><div class="record-num">${r.vittorie}</div><div class="record-label">Vittorie</div></div>
        <div class="record-block p"><div class="record-num">${r.pareggi}</div><div class="record-label">Pareggi</div></div>
        <div class="record-block s"><div class="record-num">${r.sconfitte}</div><div class="record-label">Sconfitte</div></div>
      </div>
      <div class="record-sub">${r.partite} partite &middot; ${r.gol_fatti} gol fatti &middot; ${r.gol_subiti} gol subiti &middot; media ${r.media_punti.toFixed(1)} pt</div>
    </div>

    <div class="panel">
      <h2>Striscia in corso</h2>
      <div class="streak-banner ${streakType}">
        <div class="big">${streakMsg}</div>
      </div>
    </div>

    <div class="panel">
      <h2>Ultimi 5 risultati</h2>
      <div class="last5">${badges}</div>
      <div class="last5-detail">${l5rows}</div>
    </div>

    <div class="panel">
      <h2>Serie più lunghe di sempre</h2>
      <div class="streaks-grid">
        <div class="streak-card V"><div class="num">${sl.V.lunghezza}</div><div class="lbl">Vittorie</div><div class="period">${periodo(sl.V)}</div></div>
        <div class="streak-card P"><div class="num">${sl.P.lunghezza}</div><div class="lbl">Pareggi</div><div class="period">${periodo(sl.P)}</div></div>
        <div class="streak-card S"><div class="num">${sl.S.lunghezza}</div><div class="lbl">Sconfitte</div><div class="period">${periodo(sl.S)}</div></div>
      </div>
    </div>
  `;
}

function renderRecList(title, items, unit, colorClass){
  if (!items.length) return `<div class="rec-list"><div class="rec-list-title">${title}</div><div style="color:var(--muted-2);font-size:12px;">nessun dato</div></div>`;
  const rows = items.map((it, i) => {
    let period = '';
    if (it.inizio) {
      const sa = it.inizio.stagione.replace('Risultati','');
      const sb = it.fine.stagione.replace('Risultati','');
      period = sa === sb ? `${sa} · G${it.inizio.giornata}-G${it.fine.giornata}` : `${sa} G${it.inizio.giornata} &rarr; ${sb} G${it.fine.giornata}`;
    }
    const val = it.lunghezza !== undefined ? it.lunghezza : (it.media !== undefined ? it.media.toFixed(1) : it.diff);
    return `
      <div class="rec-item">
        <div class="rec-rank">${i+1}</div>
        <div class="rec-name">${it.nome}</div>
        <div class="rec-val ${colorClass}">${val}${unit}</div>
      </div>
      ${period ? `<div class="rec-item"><div class="rec-period">${period}</div></div>` : ''}
    `;
  }).join('');
  return `<div class="rec-list"><div class="rec-list-title">${title}</div>${rows}</div>`;
}

function renderLeagueRecords(rec){
  let html = '';
  html += renderRecList('Serie vittorie consecutive &middot; record', rec.serie_vittorie_record, '', 'V');
  html += renderRecList('Serie sconfitte consecutive &middot; record', rec.serie_sconfitte_record, '', 'S');
  html += renderRecList('Serie pareggi consecutivi &middot; record', rec.serie_pareggi_record, '', 'P');
  html += renderRecList('Striscia vittorie attualmente in corso', rec.striscia_vittorie_attiva, '', 'V');
  html += renderRecList('Striscia sconfitte attualmente in corso', rec.striscia_sconfitte_attiva, '', 'S');
  html += renderRecList('Media punti più alta in carriera', rec.media_punti_top, ' pt', '');
  html += renderRecList('Miglior differenza reti (fatti - subiti)', rec.differenza_gol_top, '', '');
  document.getElementById('leagueRecords').innerHTML = html;
}

function init(){
  const select = document.getElementById('teamSelect');
  DATA.squadre.forEach((s, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = s.nome + (DATA.attive_ids.includes(s.team_id) ? '' : '  (non più in lega)');
    select.appendChild(opt);
  });
  select.addEventListener('change', () => {
    document.getElementById('teamPanels').innerHTML = renderTeam(DATA.squadre[select.value]);
  });
  select.selectedIndex = 0;
  document.getElementById('teamPanels').innerHTML = renderTeam(DATA.squadre[0]);
  renderLeagueRecords(DATA.records);
}
init();
</script>
